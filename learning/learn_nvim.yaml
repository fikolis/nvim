# ----------------------------------------------------------------------------
# NIVO 18 / 20 — BOSS 1: K8s Production Deployment Surgery
# Kombinuj: <C-a>, ci", ciw, gcc, <leader>s, ds)
# ZADATAK:
#   1. Zameni sve pojave `staging_pay_18` u `prod_pay` pomocu `<leader>s`.
#   2. Povecaj `replicas: 1` u `3` (`2<C-a>`).
#   3. Promeni image u `"registry.internal/payments:v2.4.0"`.
#   4. Promeni `runAsNonRoot: false` u `true` i skini zagrade oko `(8443)`.
