# ----------------------------------------------------------------------------
# NIVO 08 / 20 — K8s YAML Indent Popravka (`V` + `>` / `<`)
# Precice: V (selektuj linije)  |  > (uvuci za 2 razmaka)  |  < (izvuci)
# ZADATAK: Linije `requests:` i `cpu: "250m"` imaju pogresan indent.
#   1. Uvuci `requests:` na tacno 4 razmaka (ispod `resources:`).
#   2. Uvuci `cpu: "250m"` i `memory: "256Mi"` na tacno 6 razmaka (ispod `requests:`).
