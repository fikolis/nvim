# ----------------------------------------------------------------------------
# NIVO 33 / 50 — Ansible `block / rescue / always` Error Recovery
# Precice: V + J/K  |  ci"  |  ciw  |  gcc
# ZADATAK:
#   1. Postavi `become: true` u headeru playbooka.
#   2. Poredjaj sekcije ispravnim redom: `block:` -> `rescue:` -> `always:` (`V` + `J`/`K`).
#   3. Zakomentarisi `failed_when: false` (`gcc`).
#   4. U `rescue:` promeni `msg: "TODO"` u `"Rollback triggered"`, a u `always:` stavi `state: absent`.
# ----------------------------------------------------------------------------
# IGRAJ OVDE:
- name: Safe DB migration with rescue
  hosts: db_primary
  become: false
  tasks:
    - always:
        - name: Cleanup lock file
          ansible.builtin.file:
            path: /var/run/migrate.lock
            state: touch
      rescue:
        - name: Notify rollback
          ansible.builtin.debug:
            msg: "TODO"
      block:
        - name: Run schema migration
          ansible.builtin.command: /usr/local/bin/migrate-db
          failed_when: false
# OCEKIVANI REZULTAT:
#   become: true, block -> rescue -> always, # failed_when: false,
#   msg: "Rollback triggered", state: absent.

