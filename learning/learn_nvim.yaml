# ----------------------------------------------------------------------------
# NIVO 12 / 20 — Ansible FQCN Migracija za RHEL 9 (`ciw` / `ct:`)
# Precice: ct: (promeni do dvotacke!)
# ZADATAK: Pretvori stare kratke module u moderne FQCN module sa `ct:`:
#   1. `yum:` -> `ansible.builtin.dnf:`
#   2. `service:` -> `ansible.builtin.systemd:`
#   3. `copy:` -> `ansible.builtin.template:`
# ----------------------------------------------------------------------------
# IGRAJ OVDE:
- name: RHEL 9 FQCN migration
  hosts: prod_web
  tasks:
    - name: Install nginx
      yum:
        name: nginx
        state: present
    - name: Render nginx config
      copy:
        src: nginx.conf.j2
        dest: /etc/nginx/nginx.conf
    - name: Ensure nginx is running
      service:
        name: nginx
        state: started
# OCEKIVANI REZULTAT:
#   ansible.builtin.dnf:, ansible.builtin.template:, ansible.builtin.systemd:

---
# ----------------------------------------------------------------------------
# NIVO 13 / 20 — Ansible Task Reordering (`V` + `J` / `K`)
# Precice: V2j (selektuj ceo task)  |  J / K (pomeri gore/dole)
# ZADATAK: Poredjaj 3 taska u ispravan redosled izvrsavanja:
#   1. `Install nginx package`
#   2. `Deploy nginx config`
#   3. `Start and enable nginx`
# ----------------------------------------------------------------------------
# IGRAJ OVDE:
- name: Ordered deploy
  hosts: prod_web
  tasks:
    - name: Start and enable nginx
      ansible.builtin.systemd:
        name: nginx
        state: started
    - name: Install nginx package
      ansible.builtin.dnf:
        name: nginx
        state: present
    - name: Deploy nginx config
      ansible.builtin.template:
        src: nginx.conf.j2
        dest: /etc/nginx/nginx.conf
# OCEKIVANI REZULTAT: Install -> Deploy -> Start.

---
# ----------------------------------------------------------------------------
# NIVO 14 / 20 — Ansible Jinja2 & Mode Surround (`ys`, `cs`, `ds`)
# Precice: cs'"  |  ds)  |  ci"
# ZADATAK:
#   1. Obavij `app_src` u Jinja2 string `"{{ app_src }}"`.
#   2. Promeni `'/etc/nginx/conf.d/app.conf'` u `"/etc/nginx/conf.d/app.conf"` (`cs'"`).
#   3. Skini zagrade oko `("0644")` sa `ds)` -> `"0644"`.
# ----------------------------------------------------------------------------
# IGRAJ OVDE:
- name: Deploy app vhost
  ansible.builtin.template:
    src: app_src
    dest: '/etc/nginx/conf.d/app.conf'
    mode: ("0644")
# OCEKIVANI REZULTAT:
#     src: "{{ app_src }}"
#     dest: "/etc/nginx/conf.d/app.conf"
#     mode: "0644"

