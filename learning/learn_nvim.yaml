#   3. Promeni `dnsName: "shop.dev.local"` u `"shop.prod.example.com"`.
#   4. Obrisi `expired_override_43: true` (`<leader>dd`) i zakomentarisi `selfSigned: true` (`gcc`).
# ----------------------------------------------------------------------------
# IGRAJ OVDE:
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: shop-tls
spec:
  secretName: shop-tls-secret
  duration: "24h"
  renewBefore: "1h"
  expired_override_43: true
  selfSigned: true
  dnsName: "shop.dev.local"
  issuerRef:
    kind: ClusterIssuer
    name: 'letsencrypt-staging'
