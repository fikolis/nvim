apiVersion: v1
kind: Pod
metadata:
  name: worker-07
spec:
  containers:
    - name: worker
      resources:
        requests:
          memory: "512Mi"
        ephemeral-storage: "OBRISI_ME"
        limits:
          memory: "FIXME"
# OCEKIVANI REZULTAT:
#   ephemeral-storage je obrisana, limits.memory je "512Mi".

