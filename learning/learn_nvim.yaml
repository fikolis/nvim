# ----------------------------------------------------------------------------
# NIVO 20 / 20 — FINAL DEVOPS BOSS: Ansible + K8s GitOps Release Gauntlet
# Kombinuj SVE: <leader>dd, <leader>s, <C-a>, cs'", ds), gcc, V+J/K!
# ZADATAK:
#   1. Obrisi liniju `trash_flag_20: "DELETE_ME"` u void registar (`<leader>dd`).
#   2. Zameni sve pojave `canary_v1` u `stable_v2` pomocu `<leader>s`.
#   3. Povecaj `replicas: 1` na `5` (`4<C-a>`).
#   4. Promeni `env: 'staging'` u `"production"` i skini zagrade sa `(443)`.
#   5. Zakomentarisi `dry_run: true` (`gcc`) i pomeri `tier: "critical"` na vrh `labels:`.
# ----------------------------------------------------------------------------
# IGRAJ OVDE:
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-release-canary_v1
  labels:
    release: canary_v1
    tier: "critical"
spec:
  replicas: 1
  trash_flag_20: "DELETE_ME"
  dry_run: true
  template:
    spec:
      containers:
        - name: release-controller
          image: "ghcr.io/org/app:canary_v1"
          env: 'staging'
          port: (443)
# OCEKIVANI REZULTAT:
#   trash_flag_20 obrisana, stable_v2 svuda, replicas: 5,
#   tier: "critical" iznad release: stable_v2, # dry_run: true,
#   env: "production", port: 443.
