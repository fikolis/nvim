# ----------------------------------------------------------------------------
# NIVO 34 / 50 — Ansible `lineinfile` & SSH Hardening
# Precice: ci"  |  ds)  |  yi" + vi"<leader>p  |  gcc
# ZADATAK:
#   1. Promeni `"PermitRootLogin yes"` u `"PermitRootLogin no"` i `"PasswordAuthentication yes"` u `"PasswordAuthentication no"`.
#   2. Skini zagrade oko `("Port 2222")` (`ds)`) -> `"Port 2222"`.
#   3. Promeni `validate: "true"` u `"/usr/sbin/sshd -t -f %s"`.
#   4. Kopiraj `"Restart sshd"` iz handlera (`yi"`) i pregazi `notify: "FIXME"` (`vi"<leader>p`), pa zakomentarisi `AllowEmptyPasswords` (`gcc`).
# ----------------------------------------------------------------------------
# IGRAJ OVDE:
- name: Harden OpenSSH on RHEL 9
  hosts: all
  become: true
  tasks:
    - name: Lock down sshd_config
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        validate: "true"
      loop:
        - "PermitRootLogin yes"
        - "PasswordAuthentication yes"
        - ("Port 2222")
        - "AllowEmptyPasswords yes"
      notify: "FIXME"
  handlers:
    - name: "Restart sshd"
      ansible.builtin.systemd:
        name: sshd
        state: restarted
# OCEKIVANI REZULTAT:
#   PermitRootLogin no, PasswordAuthentication no, "Port 2222",
#   # - "AllowEmptyPasswords yes", validate: "/usr/sbin/sshd -t -f %s", notify: "Restart sshd".

