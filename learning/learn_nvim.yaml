# NIVO 02 / 20 — K8s Env Vars: Paste bez gubitka yanka
# Precice: yi"  |  vi"<leader>p  (`"_dP` u Visual modu)
# ZADATAK:
#   1. Kopiraj `"production"` iz `CLUSTER_ENV` pomocu `yi"`.
#   2. Pregazi `"dev"`, `"staging"` i `"local"` sa `vi"<leader>p` — BEZ
#      ponovnog kopiranja!
# ----------------------------------------------------------------------------
# IGRAJ OVDE:
apiVersion: v1
kind: ConfigMap
metadata:
  name: env-defaults
data:
  CLUSTER_ENV: "production"
  APP_ENV: "dev"
  LOG_ENV: "staging"
  METRICS_ENV: "local"
# OCEKIVANI REZULTAT:
