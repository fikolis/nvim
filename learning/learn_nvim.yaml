          effect: 'PreferNoSchedule'
      containers:
        - name: fluent-bit
          image: "fluent/fluent-bit:1.9"
          drop_all_logs: true
          volumeMounts:
            - name: varlog
              readOnly: false
      volumes:
        - name: varlog
          hostPath:
            path: '/tmp/logs'
