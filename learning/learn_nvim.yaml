# Precice: yi"  |  vi"<leader>p  |  ciw
# ZADATAK:
#   1. Kopiraj `"Restart nginx"` iz handlera sa `yi"`.
#   2. Pregazi oba `notify: "TODO"` sa `vi"<leader>p`.
#   3. U handleru promeni `state: reloaded` u `state: restarted`.
# ----------------------------------------------------------------------------
# IGRAJ OVDE:
- name: Nginx with handlers
  hosts: prod_web
  tasks:
    - name: Update main config
      ansible.builtin.template:
        src: nginx.conf.j2
        dest: /etc/nginx/nginx.conf
      notify: "TODO"
    - name: Update TLS config
      ansible.builtin.template:
        src: tls.conf.j2
        dest: /etc/nginx/conf.d/tls.conf
      notify: "TODO"
  handlers:
    - name: "Restart nginx"
      ansible.builtin.systemd:
        name: nginx
        state: reloaded
# OCEKIVANI REZULTAT:
