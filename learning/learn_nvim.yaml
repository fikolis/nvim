---
# ----------------------------------------------------------------------------
# NIVO 19 / 20 — BOSS 2: Ansible Zero-Downtime Rolling Deploy
# Kombinuj: ciw, V+J/K, yi"+vi"<leader>p, gcc
# ZADATAK:
#   1. Promeni `serial: 10` u `serial: 1` i `become: false` u `become: true`.
#   2. Zakomentarisi `ignore_errors: true` sa `gcc`.
#   3. Poredjaj 3 taska u redosled: `Drain node` -> `Upgrade app` -> `Enable node`.
#   4. Kopiraj `"Reload haproxy"` iz handlera i ubaci u `notify: "FIXME"`.
# ----------------------------------------------------------------------------
# IGRAJ OVDE:
- name: Rolling deploy
  hosts: prod_web
  serial: 10
  become: false
  ignore_errors: true
  tasks:
    - name: Enable node
      ansible.builtin.command: /usr/local/bin/node-enable
    - name: Drain node
      ansible.builtin.command: /usr/local/bin/node-drain
    - name: Upgrade app
      ansible.builtin.dnf:
        name: payments-api
        state: latest
      notify: "FIXME"
  handlers:
    - name: "Reload haproxy"
      ansible.builtin.systemd:
        name: haproxy
        state: reloaded
# OCEKIVANI REZULTAT:
#   serial: 1, become: true, # ignore_errors: true,
#   Drain -> Upgrade -> Enable, notify: "Reload haproxy".

