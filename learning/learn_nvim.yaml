# NIVO 32 / 50 — Ansible RHEL 9 SELinux & Sysctl Tuning
# Precice: ciw  |  cs'"  |  ci"  |  <leader>dd
# ZADATAK:
#   1. Prebaci SELinux iz `state: disabled` u `state: enforcing` i `policy: minimum` u `targeted`.
#   2. Promeni `name: 'net.ipv4.ip_forward'` u `"net.ipv4.ip_forward"` (`cs'"`).
