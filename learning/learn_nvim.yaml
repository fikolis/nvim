# NIVO 16 / 50 — Ansible RHEL 9 Packages & Repo (`gcc`, `ciw`, `<leader>s`)
# Precice: gcc  |  ciw  |  <leader>s
# ZADATAK:
#   1. Zakomentarisi nesigurni paket `- telnet` sa `gcc`.
#   2. Promeni `state: absent` u `state: present`.
#   3. Zameni sve pojave `old_repo_16` u `rhel9_baseos` pomocu `<leader>s`.
# ----------------------------------------------------------------------------
# IGRAJ OVDE:
- name: RHEL 9 base packages
  hosts: prod_web
  vars:
    primary_repo: old_repo_16
    fallback_repo: old_repo_16
  tasks:
    - name: Install core tools
      ansible.builtin.dnf:
