# IGRAJ OVDE:
- name: RHEL 9 SELinux and kernel tuning
  hosts: k8s_nodes
  become: true
  tasks:
    - name: Enforce SELinux
      ansible.posix.selinux:
        policy: minimum
        state: disabled
