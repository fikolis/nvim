# Precice: gcc  |  <leader>dd  |  cs'"  |  ciw
# ZADATAK:
#   1. Zakomentarisi opasni resurs `- "secrets"` i opasnu akciju `- "delete"` (`gcc`).
#   2. Obrisi liniju `wildcard_hack_24: "*"` u void registar (`<leader>dd`).
#   3. Promeni `'pods'` -> `"pods"` i `'configmaps'` -> `"configmaps"` (`cs'"`).
#   4. Promeni `roleRef` `name: cluster-admin` u `readonly-ops`.
# ----------------------------------------------------------------------------
# IGRAJ OVDE:
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ops-viewer
rules:
  - apiGroups: [""]
    wildcard_hack_24: "*"
    resources:
      - 'pods'
      - 'configmaps'
      - "secrets"
    verbs:
      - "get"
      - "list"
      - "delete"
roleRef:
  kind: ClusterRole
  name: cluster-admin
# OCEKIVANI REZULTAT:
#   # - "secrets", # - "delete", wildcard_hack_24 obrisana,
#   "pods", "configmaps", name: readonly-ops.

