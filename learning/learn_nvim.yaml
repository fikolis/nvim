# ----------------------------------------------------------------------------
# NIVO 17 / 50 — K8s NetworkPolicy Lockdown (`gcc`, `ds)`, `cs'"`)
# Precice: gcc  |  ds)  |  cs'"
# ZADATAK:
#   1. Otkomentarisi `- Egress` pomocu `gcc`.
#   2. Skini zagrade oko `(5432)` pomocu `ds)` -> `5432`.
#   3. Promeni `protocol: 'TCP'` u `"TCP"` sa `cs'"`.
#   4. Promeni `role: 'frontend'` u `"backend"`.
# ----------------------------------------------------------------------------
# IGRAJ OVDE:
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: db-allow-backend
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
    # - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              role: 'frontend'
      ports:
        - protocol: 'TCP'
          port: (5432)
# OCEKIVANI REZULTAT:
#   - Egress otkomentarisan, role: "backend", protocol: "TCP", port: 5432.

