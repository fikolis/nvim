# Precice: yi"  |  <leader>dd  |  vi"<leader>p
# ZADATAK:
#   1. Kopiraj `"512Mi"` iz `requests.memory` sa `yi"`.
#   2. Obrisi liniju `ephemeral-storage: "OBRISI_ME"` u void registar (`<leader>dd`).
