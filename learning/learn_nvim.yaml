# NIVO 23 / 50 — K8s PodDisruptionBudget & TopologySpread
# Precice: <leader>+  |  cs'"  |  ciw  |  V + K
# ZADATAK:
#   1. Povecaj `minAvailable: 0` u `2` (`2<leader>+`) i `maxSkew: 5` u `1`.
#   2. Promeni `topologyKey: 'kubernetes.io/hostname'` u `"topology.kubernetes.io/zone"`.
#   3. Promeni `whenUnsatisfiable: ScheduleAnyway` u `DoNotSchedule`.
#   4. Pomeri `app: checkout` na PRVO mesto ispod `matchLabels:` (`V` + `K`).
# ----------------------------------------------------------------------------
# IGRAJ OVDE:
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: checkout-pdb
spec:
  minAvailable: 0
  maxSkew: 5
  topologyKey: 'kubernetes.io/hostname'
  whenUnsatisfiable: ScheduleAnyway
  selector:
    matchLabels:
      tier: frontend
      app: checkout
# OCEKIVANI REZULTAT:
