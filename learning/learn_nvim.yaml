#   3. Povecaj `replicas: 1` u `3` (`2<leader>+`) i zakomentarisi `loop_forward: "127.0.0.1"` (`gcc`).
#   4. Pomeri `upstream_1: "1.1.1.1"` IZNAD `upstream_2: "8.8.8.8"` (`V` + `K`).
# ----------------------------------------------------------------------------
# IGRAJ OVDE:
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coredns
spec:
  replicas: 1
  dnsPolicy: Default
  clusterIP: "broken_dns_42"
  fallbackIP: "broken_dns_42"
  ndots: (2)
  loop_forward: "127.0.0.1"
  upstreams:
    upstream_2: "8.8.8.8"
    upstream_1: "1.1.1.1"
# OCEKIVANI REZULTAT:
#   10.96.0.10 svuda, replicas: 3, dnsPolicy: ClusterFirst, ndots: 2,
#   # loop_forward: "127.0.0.1", upstream_1 iznad upstream_2.

