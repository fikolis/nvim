# ============================================================================
#  NEOVIM DEVOPS DOJO — 50 NIVOA (KUBERNETES & ANSIBLE ZA TVOJ CONFIG)
# ============================================================================
#  Kako se igra:
#    1. Otvori ovaj fajl: `nvim learning/learn_nvim.yaml`
#    2. Radi nivoe redom (ili skoci: `/NIVO 11`, ili `:DojoNext`).
#    3. Provera je automatska. Svaki red i korak dobija `[ ]` -> `✓`.
#       Winbar na vrhu pokazuje igraca, skor i sta jos fali.
#    4. `:DojoGames` menja igru (Lua Core 33 nivoa <-> DevOps YAML 50 nivoa).
#    5. Vise igraca (Save / New / Load Game):
#         - `:DojoNew [ime]`  = New Game (novi igrac ili pocetak od 0/50)
#         - `:DojoSave [ime]` (ili `:w`) = Save Game (cuva napredak + YAML)
#         - `:DojoLoad [ime]` (ili `:DojoContinue`) = izaberi igraca i nastavi
#         - `:DojoDelete [ime]` = obrisi sacuvanog igraca
#    6. `:DojoReset` vraca tekst sa diska. `:DojoResetLevel [N]` vraca jedan nivo.
#       `:DojoResetAll` brise napredak i runde za ovu igru.
#    7. Leader je <Space>. Podsetnik: `<leader>?`. Undo: `u` / `<leader>u`.
# ============================================================================

---
# ============================================================================
#  TIER 1: KUBERNETES OSNOVE — Brojevi, Vrednosti, Komentari, Redosled (1-5)
# ============================================================================

# ----------------------------------------------------------------------------
# NIVO 01 / 50 — K8s Deployment Scale & Image Bump
# Precice: 2<leader>+ (povecaj broj)  |  ci" / f:  |  ciw
# ZADATAK:
#   1. Stani na `1` u `replicas: 1` i povecaj na `3` pomocu `2<leader>+`.
#   2. Promeni tag slike `nginx:1.25` u `nginx:1.27` (npr. `f5r7` ili `2<leader>+`).
#   3. Promeni `imagePullPolicy: Always` u `IfNotPresent` pomocu `ciw`.
# ----------------------------------------------------------------------------
# IGRAJ OVDE:
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-frontend
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: nginx
          image: "nginx:1.25"
          imagePullPolicy: Always
# OCEKIVANI REZULTAT:
#   replicas: 3
#   image: "nginx:1.27"
#   imagePullPolicy: IfNotPresent

