# NIVO 22 / 50 — K8s CronJob: Nightly Backup Incident (Pali klaster svakog minuta!)
# Precice: ci"  |  ciw  |  <leader>dd  |  gcc
# ZADATAK:
#   1. Hitno promeni `schedule: "* * * * *"` u `"0 2 * * *"` (2 ujutru!).
#   2. Promeni `concurrencyPolicy: Allow` u `Forbid` i `successfulJobsHistoryLimit: 100` u `3`.
#   3. Promeni `restartPolicy: Always` u `OnFailure`.
#   4. Obrisi `debug_sleep_22: "9999"` (`<leader>dd`) i zakomentarisi `- "--dry-run"` (`gcc`).
# ----------------------------------------------------------------------------
# IGRAJ OVDE:
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly-pg-backup
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Allow
  successfulJobsHistoryLimit: 100
  debug_sleep_22: "9999"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Always
          containers:
            - name: pg-dump
              args:
                - "--format=custom"
                - "--dry-run"
# OCEKIVANI REZULTAT:
#   schedule: "0 2 * * *", concurrencyPolicy: Forbid, successfulJobsHistoryLimit: 3,
