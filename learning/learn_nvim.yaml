# ----------------------------------------------------------------------------
# NIVO 41 / 50 — INCIDENT: CrashLoopBackOff (OOMKilled + Los Probe!)
# Precice: ci"  |  <leader>+  |  <leader>dd  |  gcc
# ZADATAK: Servis puca u produkciji svakih 5 sekundi! Popravi sve:
#   1. Podigni resurse: `memory: "32Mi"` -> `"1Gi"` i `cpu: "50m"` -> `"500m"`.
#   2. Sredi livenessProbe: `initialDelaySeconds: 1` -> `30`, `periodSeconds: 1` -> `10`, `failureThreshold: 1` -> `5`.
#   3. Obrisi `memory_leak_sim_41: "yes"` (`<leader>dd`).
#   4. Zakomentarisi `CRASH_ON_START: "1"` (`gcc`).
# ----------------------------------------------------------------------------
# IGRAJ OVDE:
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
spec:
  template:
    spec:
      containers:
        - name: orders
          memory_leak_sim_41: "yes"
          env:
            - name: CRASH_ON_START
              CRASH_ON_START: "1"
          resources:
            limits:
              memory: "32Mi"
              cpu: "50m"
          livenessProbe:
            initialDelaySeconds: 1
            periodSeconds: 1
            failureThreshold: 1
# OCEKIVANI REZULTAT:
#   memory: "1Gi", cpu: "500m", initialDelaySeconds: 30, periodSeconds: 10,
