# Precice: <leader>+  |  ci"  |  ds)  |  gcc  |  V + >
# ZADATAK:
#   1. Postavi `imageGCHighThresholdPercent: 80` i `imageGCLowThresholdPercent: 60`.
#   2. Promeni `nodefs: "1%"` u `"10%"` i skini zagrade oko `maxSize: ("100Mi")` (`ds)`).
#   3. Zakomentarisi `keep_core_dumps: true` (`gcc`).
#   4. Uvuci `logging:` pod `kubelet:` (`logging:` na 4 razmaka, `maxSize:` na 6 razmaka) sa `V` + `>`.
# ----------------------------------------------------------------------------
# IGRAJ OVDE:
apiVersion: kubelet.config.k8s.io/v1beta1
kind: KubeletConfiguration
spec:
  kubelet:
    imageGCHighThresholdPercent: 99
    imageGCLowThresholdPercent: 95
    keep_core_dumps: true
    evictionHard:
      nodefs: "1%"
  logging:
    maxSize: ("100Mi")
# OCEKIVANI REZULTAT:
#   80 / 60, nodefs: "10%", # keep_core_dumps: true,
#   logging: (4 sp), maxSize: "100Mi" (6 sp).

