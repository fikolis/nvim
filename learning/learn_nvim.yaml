# ----------------------------------------------------------------------------
# NIVO 44 / 50 — INCIDENT: Ansible Playbook Bez Zastite na Produkciji
# Precice: <leader>+  |  ciw  |  gcc  |  yi" + vi"<leader>p  |  V + K
# ZADATAK:
#   1. Postavi `serial: 2`, `max_fail_percentage: 10`, `any_errors_fatal: true`.
#   2. Zakomentarisi `force_reboot_all: true` (`gcc`).
#   3. Kopiraj `"Verify cluster quorum"` (`yi"`) i pregazi oba `"TODO_CHECK"` sa `vi"<leader>p`.
#   4. Pomeri `Backup etcd` IZNAD `Upgrade kubeadm` (`V` + `K`).
# ----------------------------------------------------------------------------
# IGRAJ OVDE:
- name: Safe K8s control-plane upgrade
  hosts: k8s_masters
  serial: 100
  max_fail_percentage: 99
  any_errors_fatal: false
  force_reboot_all: true
  vars:
    quorum_label: "Verify cluster quorum"
  pre_tasks:
    - name: "TODO_CHECK"
      ansible.builtin.command: /usr/local/bin/check-quorum
  tasks:
    - name: Upgrade kubeadm
      ansible.builtin.dnf:
        name: kubeadm
        state: latest
    - name: Backup etcd
      ansible.builtin.command: /usr/local/bin/etcd-snap
  post_tasks:
    - name: "TODO_CHECK"
      ansible.builtin.command: /usr/local/bin/check-quorum
# OCEKIVANI REZULTAT:
#   serial: 2, max_fail_percentage: 10, any_errors_fatal: true, # force_reboot_all: true,
#   oba TODO_CHECK -> "Verify cluster quorum", Backup etcd iznad Upgrade kubeadm.

