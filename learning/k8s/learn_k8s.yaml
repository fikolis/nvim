# ============================================================================
#  NEOVIM KUBERNETES & OPENSHIFT DOJO — 25 NIVOA (PRAVI K8S LSP AUTOCOMPLETE!)
# ============================================================================
#  Zasto u `learning/k8s/`?
#    Tvoj config automatski prepoznaje `**/k8s/*.yaml` kao `yaml.kubernetes`
#    i pali `yamlls` sa punom Kubernetes semom — pa rade pravi autocomplete
#    (`IfNotPresent`, `Forbid`, `OnFailure`, `ClusterFirst`...), `K` hover i
#    validacija!
#
#  Komande:
#    - `:DojoGames`         = menjaj igru (Lua Core 33 | K8s 25 | Ansible 25)
#    - `:Dojo` / `:DojoNext`= status svih nivoa / skok na sledeci nedovrsen
#    - `:DojoNew [ime]`     = New Game (novi igrac ili reset)
#    - `:DojoSave` (ili `:w`) / `:DojoLoad` = Save / Load Game za vise igraca
#    - `:DojoResetLevel [N]`= vrati samo trenutni/zadati nivo na pocetak
#    - `:DojoHint`          = objasnjenje (mnemonik) za sve precice u ovom nivou!
#    - `<broj><Space>+` / `<broj><Space>-` = povecaj/smanji broj (tmux-safe!)
#
#  Brzi recnik mnemonika ([v/c/d/y] + [i=inside / a=around] + [w/"/'/(/{]):
#    vi" = Visual Inside " "       | ci' = Change Inside ' '     | ci" = Change Inside " "
#    ciw = Change Inside Word      | yi" = Yank Inside " "       | f5r7 = Find '5', Replace '7'
#    vi"<leader>p = Visual Inside " " + Paste bez gubitka yanka  | <leader>dd = obrisi u crnu rupu
#    ysiw" = You Surround Word "   | cs'" = Change Surround '->" | ds) = Delete Surround )
#    gcc = komentar linije         | V2jgc = Visual + 2 dole + komentar | <leader>s = zameni rec svuda
#    V+J/K = Visual line gore/dole | V+> = Visual line uvuci     | 2<leader>+ = povecaj broj (+2)
# ============================================================================

---
# ============================================================================
#  TIER 1: K8S OSNOVE — Brojevi, Paste, Komentari, Redosled, Zamena (1-5)
# ============================================================================

# ----------------------------------------------------------------------------
# NIVO 01 / 25 — Deployment Scale & Image Bump (Probaj K8s LSP autocomplete!)
# Precice: 2<leader>+  |  f5r7  |  ciw + <C-n>/<C-y>
# HINT: `f5r7` = Find '5' pa Replace sa '7' | `ciw` = Change Inner Word | `2<leader>+` = povecaj broj za +2
# ZADATAK:
#   1. Na `replicas: 1` pritisni `2<leader>+` -> `3`.
#   2. Na `image: "nginx:1.25"` promeni tag u `nginx:1.27` (`f5r7` ili `f2` pa `2<leader>+`).
#   3. Na `imagePullPolicy: Always` uradi `ciw`, kucaj `IfNot` i potvrdi iz K8s autocomplete-a (`<C-y>`) -> `IfNotPresent`.
# ----------------------------------------------------------------------------
# IGRAJ OVDE:
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-frontend
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: nginx
          image: "nginx:1.25"
          imagePullPolicy: Always
# OCEKIVANI REZULTAT:
#   replicas: 3, image: "nginx:1.27", imagePullPolicy: IfNotPresent

---
# ----------------------------------------------------------------------------
# NIVO 02 / 25 — ConfigMap Env Vars: Paste bez gubitka yanka
# Precice: yi"  |  vi"<leader>p
# HINT: `yi"` = Yank Inner "..." (kopiraj unutar navodnika) | `vi"` = Visual Inner "..." | `<leader>p` = Paste bez gubitka yanka
# ZADATAK:
#   1. Kopiraj `"production"` iz `CLUSTER_ENV` sa `yi"`.
#   2. Pregazi `"dev"`, `"staging"` i `"local"` sa `vi"<leader>p` bez ponovnog kopiranja!
# ----------------------------------------------------------------------------
# IGRAJ OVDE:
apiVersion: v1
kind: ConfigMap
metadata:
  name: env-defaults
data:
  CLUSTER_ENV: "production"
  APP_ENV: "dev"
  LOG_ENV: "staging"
  METRICS_ENV: "local"
# OCEKIVANI REZULTAT: APP_ENV, LOG_ENV, METRICS_ENV = "production"

---
# ----------------------------------------------------------------------------
# NIVO 03 / 25 — Container Ports & ReadinessProbe (`gcc` / `V2jgc`)
# Precice: gcc  |  V2jgc
# HINT: `gcc` = toggle komentar 1 linije | `V2jgc` = Visual Line + 2 linije dole + toggle komentar
# ZADATAK:
#   1. Zakomentarisi debug port `containerPort: 9999` pomocu `gcc`.
#   2. Otkomentarisi sve 3 linije `readinessProbe` odjednom (`V2jgc`).
# ----------------------------------------------------------------------------
# IGRAJ OVDE:
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-server
spec:
  template:
    spec:
      containers:
        - name: api
          ports:
            - containerPort: 8080
            - containerPort: 9999
          # readinessProbe:
          #   httpGet:
          #     path: /healthz
# OCEKIVANI REZULTAT: # - containerPort: 9999, readinessProbe otkomentarisan.

---
# ----------------------------------------------------------------------------
# NIVO 04 / 25 — InitContainer Args Redosled (`V` + `J`/`K`)
# Precice: V  |  J (dole)  |  K (gore)
# ZADATAK: Poredjaj korake u `args:` od 1 do 4 pomocu `V` i `J`/`K`!
# ----------------------------------------------------------------------------
# IGRAJ OVDE:
apiVersion: v1
kind: Pod
metadata:
  name: db-migrator
spec:
  containers:
    - name: init
      args:
        - "3. seed-cache"
        - "1. wait-for-db"
        - "4. warm-up"
        - "2. run-migrations"
# OCEKIVANI REZULTAT: 1 -> 2 -> 3 -> 4

---
# ----------------------------------------------------------------------------
# NIVO 05 / 25 — Service Namespace Zamena svuda (`<leader>s`)
# Precice: <leader>s
# ZADATAK: Stani na `legacy_ns_05`, pritisni `<leader>s`, ukucaj `prod_payments` + `<Enter>`.
# ----------------------------------------------------------------------------
# IGRAJ OVDE:
apiVersion: v1
kind: Service
metadata:
  name: payments-svc
  namespace: legacy_ns_05
  labels:
    owner-ns: legacy_ns_05
spec:
  externalName: db.legacy_ns_05.svc.cluster.local
  selector:
    ns: legacy_ns_05
# OCEKIVANI REZULTAT: Sve 4 pojave su `prod_payments`.

