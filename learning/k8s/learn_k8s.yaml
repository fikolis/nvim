# ----------------------------------------------------------------------------
# NIVO 18 / 25 — ExternalSecrets & Vault Integracija
# Precice: <leader>s  |  ds)  |  ciw  |  <leader>dd  |  gcc
# ZADATAK:
#   1. Zameni sve pojave `vault_staging_18` u `vault_prod` sa `<leader>s`.
#   2. Skini zagrade oko `refreshInterval: ("15m")` (`ds)`).
#   3. Promeni `creationPolicy: Orphan` u `Owner`.
#   4. Obrisi `plaintext_leak_18: "hunter2"` (`<leader>dd`) i zakomentarisi `allowInsecureTLS: true` (`gcc`).
