# ----------------------------------------------------------------------------
# NIVO 06 / 25 — ConfigMap Surround (`ysiw"`, `cs'"`, `ds)`)
# Precice: ysiw"  |  cs'"  |  ds)
# HINT: `ysiw"` = You Surround Inner Word sa `"` | `cs'"` = Change Surround `'` u `"` | `ds)` = Delete Surround `)` (obrisi okruzeno)
# ZADATAK:
#   1. Stavi `eu_central` u duple navodnike (`ysiw"`) -> `"eu_central"`.
#   2. Promeni `'8080'` u `"8080"` sa `cs'"`.
#   3. Skini zagrade oko `("30s")` sa `ds)` -> `"30s"`.
# ----------------------------------------------------------------------------
# IGRAJ OVDE:
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-settings
data:
  REGION: eu_central
  PORT: '8080'
  TIMEOUT: ("30s")
# OCEKIVANI REZULTAT: "eu_central", "8080", "30s"

---
# ----------------------------------------------------------------------------
# NIVO 07 / 25 — Resources Void Delete (`yi"`, `<leader>dd`, `vi"<leader>p`)
# Precice: yi"  |  <leader>dd  |  vi"<leader>p
# HINT: `<leader>dd` = Delete liniju u crnu rupu (ne brise ono sto si kopirao sa `yi"`!)
# ZADATAK:
#   1. Kopiraj `"512Mi"` iz `requests.memory` sa `yi"`.
#   2. Obrisi `ephemeral-storage: "OBRISI_ME"` u void registar (`<leader>dd`).
#   3. Zameni `"FIXME"` u `limits.memory` sa `vi"<leader>p`.
# ----------------------------------------------------------------------------
# IGRAJ OVDE:
apiVersion: v1
kind: Pod
metadata:
  name: worker-07
spec:
  containers:
    - name: worker
      resources:
        requests:
          memory: "512Mi"
        ephemeral-storage: "OBRISI_ME"
        limits:
          memory: "FIXME"
# OCEKIVANI REZULTAT: ephemeral-storage obrisana, limits.memory: "512Mi".

---
# ----------------------------------------------------------------------------
# NIVO 08 / 25 — YAML Indent Popravka (`V` + `>` / `<`)
# Precice: V  |  > (uvuci 2 razmaka)  |  < (izvuci)
# HINT: `V` = Visual Line selekcija | `>` = uvuci udesno (2 razmaka u YAML-u) | `.` = ponovi poslednji potez!
# ZADATAK:
#   1. Uvuci `requests:` na tacno 4 razmaka (ispod `resources:`).
#   2. Uvuci `cpu: "250m"` i `memory: "256Mi"` na tacno 6 razmaka.
# ----------------------------------------------------------------------------
# IGRAJ OVDE:
apiVersion: v1
kind: Pod
metadata:
  name: indent-fix
spec:
  resources:
requests:
  cpu: "250m"
  memory: "256Mi"
# OCEKIVANI REZULTAT: requests (4 sp), cpu & memory (6 sp).

---
# ----------------------------------------------------------------------------
# NIVO 09 / 25 — SecurityContext Hardening (`ciw`, `gcc`)
# Precice: ciw  |  gcc
# ZADATAK:
#   1. Promeni `runAsNonRoot: false` u `true`.
#   2. Promeni `readOnlyRootFilesystem: false` u `true`.
#   3. Promeni `allowPrivilegeEscalation: true` u `false`.
#   4. Zakomentarisi `privileged: true` pomocu `gcc`.
# ----------------------------------------------------------------------------
# IGRAJ OVDE:
apiVersion: v1
kind: Pod
metadata:
  name: secure-pod
spec:
  containers:
    - name: app
      image: "nginx:1.27"
      securityContext:
        runAsNonRoot: false
        readOnlyRootFilesystem: false
        allowPrivilegeEscalation: true
        privileged: true
# OCEKIVANI REZULTAT: true, true, false, # privileged: true

---
# ----------------------------------------------------------------------------
# NIVO 10 / 25 — HPA & Annotations (`cs'"`, `ci"`, `<leader>+`, `gcc`)
# Precice: cs'"  |  ci"  |  <leader>+  |  gcc
# ZADATAK:
#   1. Promeni `host: 'old.example.com'` u `"api.prod.internal"`.
#   2. Povecaj `minReplicas: 1` u `2` i `maxReplicas: 3` u `10` (`<leader>+`).
#   3. Zakomentarisi `beta_debug: "true"` sa `gcc`.
# ----------------------------------------------------------------------------
# IGRAJ OVDE:
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-hpa
  annotations:
    host: 'old.example.com'
    beta_debug: "true"
spec:
  minReplicas: 1
  maxReplicas: 3
# OCEKIVANI REZULTAT: host "api.prod.internal", # beta_debug, min 2, max 10.

---
# ----------------------------------------------------------------------------
# NIVO 11 / 25 — NetworkPolicy Lockdown (`gcc`, `ds)`, `cs'"`)
# Precice: gcc  |  ds)  |  cs'"
# ZADATAK:
#   1. Otkomentarisi `- Egress` pomocu `gcc`.
#   2. Skini zagrade oko `(5432)` sa `ds)` -> `5432`.
#   3. Promeni `protocol: 'TCP'` u `"TCP"` sa `cs'"`.
#   4. Promeni `role: 'frontend'` u `"backend"`.
# ----------------------------------------------------------------------------
# IGRAJ OVDE:
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: db-allow-backend
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
    # - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              role: 'frontend'
      ports:
        - protocol: 'TCP'
          port: (5432)
# OCEKIVANI REZULTAT: - Egress, role "backend", protocol "TCP", port 5432.

