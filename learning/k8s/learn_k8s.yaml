# ----------------------------------------------------------------------------
# NIVO 25 / 25 — FINAL K8S BOSS: Zero-Trust Production Cutover!
# Kombinuj SVE: <leader>dd, <leader>s, <leader>+, cs'", ds), gcc, V+J/K, yi"+vi"<leader>p
# ZADATAK:
#   1. Obrisi `cutover_trash_25: "DELETE_ME"` u void registar (`<leader>dd`).
#   2. Zameni sve pojave `rc_alpha_25` u `prod_v5` sa `<leader>s` (4 pojave!).
#   3. Povecaj `replicas: 1` -> `8` (`7<leader>+`) i postavi `imagePullPolicy: IfNotPresent`.
#   4. Sredi surround: `'eu-central-1'` -> `"eu-central-1"`, `("v5.0.0")` -> `"v5.0.0"`, `(8443)` -> `8443`.
#   5. Upali `runAsNonRoot: true`, otkomentarisi `- Egress`, zakomentarisi `chaos_mode: true` (`gcc`).
#   6. Poredjaj 4 cutover faze u `cutover_plan:` od 1 do 4 (`V` + `J`/`K`).
#   7. Kopiraj `"Notify SRE Slack"` (`yi"`) i pregazi oba `notify: "FIXME"` sa `vi"<leader>p`.
# ----------------------------------------------------------------------------
# IGRAJ OVDE:
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cutover-rc_alpha_25
  namespace: rc_alpha_25
  labels:
    region: 'eu-central-1'
    release_tag: ("v5.0.0")
spec:
  replicas: 1
  cutover_trash_25: "DELETE_ME"
  chaos_mode: true
  policyTypes:
    - Ingress
    # - Egress
  slack_handler: "Notify SRE Slack"
  pre_notify: "FIXME"
  post_notify: "FIXME"
  cutover_plan:
    - "4. Full cutover"
    - "2. DB migration"
    - "1. Preflight check"
    - "3. Canary rollout"
  template:
    spec:
      securityContext:
        runAsNonRoot: false
      containers:
        - name: platform
          image: "ghcr.io/sre/platform:rc_alpha_25"
          imagePullPolicy: Always
          ports:
            - containerPort: (8443)
          env:
            - name: RELEASE
              value: "rc_alpha_25"
# OCEKIVANI REZULTAT:
#   trash obrisan, prod_v5 4x, replicas 8, IfNotPresent, surround cist,
#   runAsNonRoot true, - Egress, # chaos_mode, cutover_plan 1..4, 2x Notify SRE Slack.
