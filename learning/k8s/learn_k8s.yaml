# ----------------------------------------------------------------------------
# NIVO 12 / 25 — StatefulSet: Postgres HA Klaster
# Precice: 2<leader>+  |  ci"  |  ds)  |  gcc
# ZADATAK:
#   1. Povecaj `replicas: 1` u `3` (`2<leader>+`) i `serviceName: "pg-dev"` u `"postgres-headless"`.
#   2. Promeni image u `"postgres:16.4-alpine"`.
#   3. Skini zagrade oko `("50Gi")` (`ds)`) i promeni `storageClassName: "hdd"` u `"fast-ssd"`.
#   4. Zakomentarisi `PG_DEBUG_SQL: "true"` sa `gcc`.
# ----------------------------------------------------------------------------
# IGRAJ OVDE:
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-ha
spec:
  serviceName: "pg-dev"
  replicas: 1
  template:
    spec:
      containers:
        - name: postgres
          image: "postgres:14.0"
          env:
            - name: PG_DEBUG_SQL
              value: "true"
              # PG_DEBUG_SQL_MARKER
            - name: PG_DEBUG_SQL_FLAG
              PG_DEBUG_SQL: "true"
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        storageClassName: "hdd"
        resources:
          requests:
            storage: ("50Gi")
# OCEKIVANI REZULTAT: replicas 3, postgres-headless, 16.4-alpine, fast-ssd, "50Gi", # PG_DEBUG_SQL.

---
# ----------------------------------------------------------------------------
# NIVO 13 / 25 — CronJob: Nightly Backup Incident (Probaj K8s autocomplete!)
# Precice: ci"  |  ciw + <C-y>  |  <leader>dd  |  gcc
# ZADATAK:
#   1. Hitno promeni `schedule: "* * * * *"` u `"0 2 * * *"`.
#   2. Promeni `concurrencyPolicy: Allow` u `Forbid` (probaj autocomplete!) i `successfulJobsHistoryLimit: 100` u `3`.
#   3. Promeni `restartPolicy: Always` u `OnFailure` (probaj autocomplete!).
#   4. Obrisi `debug_sleep_13: "9999"` (`<leader>dd`) i zakomentarisi `- "--dry-run"` (`gcc`).
# ----------------------------------------------------------------------------
# IGRAJ OVDE:
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly-pg-backup
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Allow
  successfulJobsHistoryLimit: 100
  debug_sleep_13: "9999"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Always
          containers:
            - name: pg-dump
              image: "postgres:16.4-alpine"
              args:
                - "--format=custom"
                - "--dry-run"
# OCEKIVANI REZULTAT: "0 2 * * *", Forbid, 3, OnFailure, debug_sleep obrisana, # - "--dry-run".

---
# ----------------------------------------------------------------------------
# NIVO 14 / 25 — PodDisruptionBudget & TopologySpread
# Precice: <leader>+  |  cs'"  |  ciw  |  V + K
# ZADATAK:
#   1. Povecaj `minAvailable: 0` u `2` (`2<leader>+`) i `maxSkew: 5` u `1`.
#   2. Promeni `topologyKey: 'kubernetes.io/hostname'` u `"topology.kubernetes.io/zone"`.
#   3. Promeni `whenUnsatisfiable: ScheduleAnyway` u `DoNotSchedule`.
#   4. Pomeri `app: checkout` na PRVO mesto ispod `matchLabels:` (`V` + `K`).
# ----------------------------------------------------------------------------
# IGRAJ OVDE:
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: checkout-pdb
spec:
  minAvailable: 0
  maxSkew: 5
  topologyKey: 'kubernetes.io/hostname'
  whenUnsatisfiable: ScheduleAnyway
  selector:
    matchLabels:
      tier: frontend
      app: checkout
# OCEKIVANI REZULTAT: minAvailable 2, maxSkew 1, zone, DoNotSchedule, app prvi.

---
# ----------------------------------------------------------------------------
# NIVO 15 / 25 — RBAC Least-Privilege Audit
# Precice: gcc  |  <leader>dd  |  cs'"  |  ciw
# ZADATAK:
#   1. Zakomentarisi `- "secrets"` i `- "delete"` (`gcc`).
#   2. Obrisi `wildcard_hack_15: "*"` (`<leader>dd`).
#   3. Promeni `'pods'` -> `"pods"` i `'configmaps'` -> `"configmaps"` (`cs'"`).
#   4. Promeni `roleRef.name: cluster-admin` u `readonly-ops`.
# ----------------------------------------------------------------------------
# IGRAJ OVDE:
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ops-viewer
rules:
  - apiGroups: [""]
    wildcard_hack_15: "*"
    resources:
      - 'pods'
      - 'configmaps'
      - "secrets"
    verbs:
      - "get"
      - "list"
      - "delete"
roleRef:
  kind: ClusterRole
  name: cluster-admin
# OCEKIVANI REZULTAT: # secrets, # delete, wildcard obrisana, "pods", "configmaps", readonly-ops.

---
# ----------------------------------------------------------------------------
# NIVO 16 / 25 — OpenShift Route & TLS Edge Termination
# Precice: ci"  |  ciw  |  ds)  |  <leader>+  |  gcc
# ZADATAK:
#   1. Promeni `host: "portal.apps.dev.local"` u `"portal.apps.ocp-prod.internal"`.
#   2. Promeni `termination: passthrough` u `edge` i `insecureEdgeTerminationPolicy: Allow` u `Redirect`.
#   3. Skini zagrade oko `targetPort: (8443)` (`ds)`) i stavi `weight: 100`.
#   4. Zakomentarisi `haproxy_debug: "on"` sa `gcc`.
# ----------------------------------------------------------------------------
# IGRAJ OVDE:
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: customer-portal
  annotations:
    haproxy_debug: "on"
spec:
  host: "portal.apps.dev.local"
  to:
    kind: Service
    name: portal-svc
    weight: 50
  port:
    targetPort: (8443)
  tls:
    termination: passthrough
    insecureEdgeTerminationPolicy: Allow
# OCEKIVANI REZULTAT: ocp-prod host, weight 100, targetPort 8443, edge, Redirect, # haproxy_debug.

