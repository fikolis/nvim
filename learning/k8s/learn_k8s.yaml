# ----------------------------------------------------------------------------
# NIVO 24 / 25 — BOSS 1: Multi-Container Envoy Sidecar Mesh Deployment
# Kombinuj: <leader>s, <leader>+, ci", ciw, ds), gcc, <leader>dd, V+J/K
# ZADATAK:
#   1. Zameni sve pojave `beta_mesh_24` u `prod_mesh` (`<leader>s`).
#   2. Povecaj `replicas: 1` u `4` (`3<leader>+`) i postavi `runAsNonRoot: true`.
#   3. Promeni envoy image u `"envoyproxy/envoy:v1.31"` i skini zagrade sa `containerPort: (15001)` (`ds)`).
#   4. Zakomentarisi `ENVOY_LOG_LEVEL: "trace"` (`gcc`) i obrisi `sidecar_junk_24: "bye"` (`<leader>dd`).
#   5. Poredjaj `containers_order` redom: `init-config` -> `app` -> `envoy-sidecar` (`V` + `J`/`K`).
# ----------------------------------------------------------------------------
# IGRAJ OVDE:
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-beta_mesh_24
  namespace: beta_mesh_24
spec:
  replicas: 1
  sidecar_junk_24: "bye"
  containers_order:
    - "envoy-sidecar"
    - "init-config"
    - "app"
  template:
    metadata:
      labels:
        mesh: beta_mesh_24
    spec:
      securityContext:
        runAsNonRoot: false
      containers:
        - name: envoy-sidecar
          image: "envoyproxy/envoy:v1.20"
          ports:
            - containerPort: (15001)
          env:
            - name: ENVOY_LOG_LEVEL
              ENVOY_LOG_LEVEL: "trace"
# OCEKIVANI REZULTAT: prod_mesh, replicas 4, runAsNonRoot true, envoy v1.31, 15001, # ENVOY_LOG_LEVEL, order 1..3.

