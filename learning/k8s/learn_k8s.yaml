# ----------------------------------------------------------------------------
# NIVO 19 / 25 — Prometheus AlertRule: 3 AM PagerDuty Spas
# Precice: V + K  |  ci"  |  gcc
# ZADATAK:
#   1. Pomeri `alert: HighPodRestarts` na PRVO mesto ispod `rules:` (`V` + `K`).
#   2. Promeni `for: "1s"` u `"5m"`.
#   3. Promeni `severity: "info"` u `"critical"` i `team: "unknown"` u `"sre-platform"`.
#   4. Promeni `runbook: "TODO"` u `"https://wiki.internal/oom"` i zakomentarisi `mute_all_alerts: true` (`gcc`).
# ----------------------------------------------------------------------------
# IGRAJ OVDE:
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: pod-alerts
spec:
  rules:
    for: "1s"
    alert: HighPodRestarts
    mute_all_alerts: true
    labels:
      severity: "info"
      team: "unknown"
    annotations:
      runbook: "TODO"
# OCEKIVANI REZULTAT: alert prvi, "5m", # mute_all_alerts, critical, sre-platform, runbook URL.

---
# ----------------------------------------------------------------------------
# NIVO 20 / 25 — DaemonSet: Node Log Collector
# Precice: ci"  |  cs'"  |  ciw  |  gcc
# ZADATAK:
#   1. Promeni image u `"fluent/fluent-bit:3.1"`.
#   2. Promeni `path: '/tmp/logs'` u `"/var/log/containers"` i `readOnly: false` u `true`.
#   3. Promeni `operator: 'Equal'` u `"Exists"` i `effect: 'PreferNoSchedule'` u `"NoSchedule"`.
#   4. Zakomentarisi `drop_all_logs: true` sa `gcc`.
# ----------------------------------------------------------------------------
# IGRAJ OVDE:
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
spec:
  template:
    spec:
      tolerations:
        - operator: 'Equal'
          effect: 'PreferNoSchedule'
      containers:
        - name: fluent-bit
          image: "fluent/fluent-bit:1.9"
          drop_all_logs: true
          volumeMounts:
            - name: varlog
              readOnly: false
      volumes:
        - name: varlog
          hostPath:
            path: '/tmp/logs'
# OCEKIVANI REZULTAT: fluent-bit:3.1, /var/log/containers, readOnly true, Exists, NoSchedule, # drop_all_logs.

---
# ----------------------------------------------------------------------------
# NIVO 21 / 25 — INCIDENT: CrashLoopBackOff (OOMKilled + Los Probe!)
# Precice: ci"  |  <leader>+  |  <leader>dd  |  gcc
# ZADATAK:
#   1. Podigni resurse: `memory: "32Mi"` -> `"1Gi"` i `cpu: "50m"` -> `"500m"`.
#   2. Sredi livenessProbe: `initialDelaySeconds: 1` -> `30`, `periodSeconds: 1` -> `10`, `failureThreshold: 1` -> `5`.
#   3. Obrisi `memory_leak_sim_21: "yes"` (`<leader>dd`).
#   4. Zakomentarisi `CRASH_ON_START: "1"` (`gcc`).
# ----------------------------------------------------------------------------
# IGRAJ OVDE:
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
spec:
  template:
    spec:
      containers:
        - name: orders
          image: "quay.io/org/orders:v2"
          memory_leak_sim_21: "yes"
          env:
            - name: CRASH_ON_START
              CRASH_ON_START: "1"
          resources:
            limits:
              memory: "32Mi"
              cpu: "50m"
          livenessProbe:
            initialDelaySeconds: 1
            periodSeconds: 1
            failureThreshold: 1
# OCEKIVANI REZULTAT: 1Gi, 500m, 30/10/5, memory_leak obrisana, # CRASH_ON_START.

---
# ----------------------------------------------------------------------------
# NIVO 22 / 25 — INCIDENT: CoreDNS Split-Brain & Loop (Probaj dnsPolicy autocomplete!)
# Precice: <leader>s  |  ds)  |  ciw + <C-y>  |  <leader>+  |  gcc  |  V + K
# ZADATAK:
#   1. Zameni sve pojave `broken_dns_22` u `10.96.0.10` sa `<leader>s`.
#   2. Skini zagrade oko `ndots: (2)` (`ds)`) i promeni `dnsPolicy: Default` u `ClusterFirst`.
#   3. Povecaj `replicas: 1` u `3` (`2<leader>+`) i zakomentarisi `loop_forward: "127.0.0.1"` (`gcc`).
#   4. Pomeri `upstream_1: "1.1.1.1"` IZNAD `upstream_2: "8.8.8.8"` (`V` + `K`).
# ----------------------------------------------------------------------------
# IGRAJ OVDE:
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coredns
spec:
  replicas: 1
  template:
    spec:
      dnsPolicy: Default
      clusterIP: "broken_dns_22"
      fallbackIP: "broken_dns_22"
      ndots: (2)
      loop_forward: "127.0.0.1"
      upstreams:
        upstream_2: "8.8.8.8"
        upstream_1: "1.1.1.1"
# OCEKIVANI REZULTAT: 10.96.0.10, replicas 3, ClusterFirst, ndots 2, # loop_forward, upstream_1 prvi.

---
# ----------------------------------------------------------------------------
# NIVO 23 / 25 — INCIDENT: Istekao TLS Sertifikat (cert-manager)
# Precice: ci"  |  cs'"  |  <leader>dd  |  gcc
# ZADATAK:
#   1. Prebaci `issuerRef.name: 'letsencrypt-staging'` u `"letsencrypt-prod"`.
#   2. Postavi `duration: "2160h"` i `renewBefore: "360h"`.
#   3. Promeni `dnsName: "shop.dev.local"` u `"shop.prod.example.com"`.
#   4. Obrisi `expired_override_23: true` (`<leader>dd`) i zakomentarisi `selfSigned: true` (`gcc`).
# ----------------------------------------------------------------------------
# IGRAJ OVDE:
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: shop-tls
spec:
  secretName: shop-tls-secret
  duration: "24h"
  renewBefore: "1h"
  expired_override_23: true
  selfSigned: true
  dnsName: "shop.dev.local"
  issuerRef:
    kind: ClusterIssuer
    name: 'letsencrypt-staging'
# OCEKIVANI REZULTAT: letsencrypt-prod, 2160h, 360h, shop.prod.example.com, override obrisan, # selfSigned.

